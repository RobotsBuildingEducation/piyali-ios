name: Piyali
options:
  bundleIdPrefix: app.piyali
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": '-'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.2
  NostrSDK:
    path: Vendor/NostrSDK
  CashuSwift:
    url: https://github.com/zeugmaster/CashuSwift.git
    revision: cd95afd419429539e97886a77f8ecb9cc5238d9a
targets:
  Piyali:
    type: application
    platform: iOS
    sources:
      - path: Piyali
        excludes: ["Resources/GoogleService-Info.plist", "Resources/AppConfiguration.local.plist"]
    postBuildScripts:
      - name: Copy local service configuration if present
        basedOnDependencyAnalysis: false
        script: |
          for config in GoogleService-Info.plist AppConfiguration.local.plist; do
            source="$SRCROOT/Piyali/Resources/$config"
            destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$config"
            if [ -f "$source" ]; then
              cp "$source" "$destination"
            else
              rm -f "$destination"
            fi
          done
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAILogic
      - package: NostrSDK
        product: NostrSDK
      - package: CashuSwift
        product: CashuSwift
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piyali.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Piyali
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak with your language tutor and practice pronunciation.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your spoken practice into text for feedback from Piyali.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Protect your private Piyali key when making a backup.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Piyali/Resources/Info.plist
      properties:
        UIAppFonts: [DMSans-400.ttf, DMSans-500.ttf, DMSans-600.ttf, DMSans-700.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.piyali.subscription
            CFBundleURLSchemes: [piyali]
  PiyaliTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PiyaliAppTests, Tests/Shared]
    dependencies:
      - target: Piyali
  PiyaliUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/PiyaliUITests, Tests/Shared]
    dependencies:
      - target: Piyali
      - package: NostrSDK
        product: NostrSDK
schemes:
  Piyali:
    build:
      targets:
        Piyali: all
    test:
      targets: [PiyaliTests, PiyaliUITests]

  PiyaliStoreKit:
    build:
      targets:
        Piyali: all
    run:
      storeKitConfiguration: Tests/PiyaliAppTests/Fixtures/PiyaliSubscriptions.storekit
    test:
      targets: [PiyaliTests]
