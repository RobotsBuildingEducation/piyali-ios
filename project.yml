name: Piyali
options:
  bundleIdPrefix: app.piyali
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": '-'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.2
  NostrSDK:
    url: https://github.com/nostr-sdk/nostr-sdk-ios.git
    revision: e5855cbd3bdabf44075fd2abdf76f63bac4cbd5f
targets:
  Piyali:
    type: application
    platform: iOS
    sources:
      - path: Piyali
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAI
      - package: NostrSDK
        product: NostrSDK
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piyali.ios
        INFOPLIST_KEY_CFBundleDisplayName: Piyali
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak with your language tutor and practice pronunciation.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your spoken practice into text for feedback from Piyali.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Protect your private Piyali key when making a backup.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Piyali/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.piyali.subscription
            CFBundleURLSchemes: [piyali]
  PiyaliTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PiyaliAppTests]
    dependencies:
      - target: Piyali
  PiyaliUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/PiyaliUITests]
    dependencies:
      - target: Piyali
schemes:
  Piyali:
    build:
      targets:
        Piyali: all
    test:
      targets: [PiyaliTests, PiyaliUITests]
