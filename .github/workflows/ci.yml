name: iPhone checks
on: [push, pull_request]
jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BackendReference/package-lock.json
      - run: npm ci --prefix BackendReference
      - run: npm test --prefix BackendReference
      - run: npm ci --prefix Backend
      - run: npm test --prefix Backend
  iphone:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project Piyali.xcodeproj -scheme Piyali -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  firestore:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@13.25.0
      - run: scripts/test-firestore.sh
      - run: npm ci --prefix Backend
      - run: firebase --config firebase.json --project demo-piyali-ios-auth emulators:exec --only firestore "PIYALI_RULES_EMULATOR=1 node --test Backend/test/*.test.js"
